"$schema" = "./node_modules/wrangler/config-schema.json"
name = "bazel-cache"
main = "index.js"
compatibility_date = "2026-08-20"
workers_dev = false
upload_source_maps = true

[route]
pattern = "bazel-cache.piperswe.me"
custom_domain = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bazel-cache"

[secrets]
required = ["PASSWORD"]
