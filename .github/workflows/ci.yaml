name: CI
on:
  push:
    branches: ["**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mise
        uses: jdx/mise-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup cache
        run: echo "build --remote_cache=https://user:${{ secrets.BAZEL_CACHE_PASSWORD }}@bazel-cache.piperswe.me/Codebase" > user.bazelrc
      - name: Build
        run: mise build
      - name: Test
        run: bazel test --config=docker --test_output=all //...
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push Docker images
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}
        run: |
          REGISTRY=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          export REGISTRY
          bazel run //:push_images
