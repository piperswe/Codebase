name: Git tag
on:
  push:
    tags: ["**"]
jobs:
  tag-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mise
        uses: jdx/mise-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'go.sum', 'pnpm-lock.yaml', 'maven_install.json') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-
      - name: Setup cache
        run: |
          {
            echo "common --config=ci"
            echo "build --remote_cache=https://user:${{ secrets.BAZEL_CACHE_PASSWORD }}@bazel-cache.piperswe.me/Codebase"
          } > user.bazelrc
      - name: Build
        run: mise build
      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push Docker images
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          REGISTRY=$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          export REGISTRY
          bazel run //:push_images -- --tag "$IMAGE_TAG"
