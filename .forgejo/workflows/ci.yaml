name: CI
on:
  push:
    branches: ["**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mise
        uses: https://github.com/jdx/mise-action@v4
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.API_TOKEN_FOR_GITHUB }}
      - name: Setup cache
        run: echo "build --remote_cache=https://user:${{ secrets.BAZEL_CACHE_PASSWORD }}@bazel-cache.piperswe.me/Codebase" > user.bazelrc
      - name: Build
        run: mise build
      - name: Test
        run: bazel test --test_output=all //...
