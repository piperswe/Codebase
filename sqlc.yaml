version: "2"
sql:
  - engine: "sqlite"
    queries: "projects/datasite/internal/db/queries.sql"
    schema: "projects/datasite/internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "projects/datasite/internal/db"
        sql_package: "database/sql"
  - engine: "sqlite"
    queries: "projects/datasite/internal/cache/queries.sql"
    schema: "projects/datasite/internal/cache/migrations"
    gen:
      go:
        package: "cache"
        out: "internal/cache"
        sql_package: "database/sql"
